app:
  name: "AiDrama API"
  version: "1.0.0"
  debug: true
  language: "zh"

server:
  port: 5679
  host: "0.0.0.0"
  cors_origins:
    - "http://localhost:3013"
  read_timeout: 600
  write_timeout: 600

database:
  type: "mysql"
  name: "AiDrama"
  # Runtime database credentials are read from .env or process env:
  # DATABASE_URL or DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME.

storage:
  type: "local"
  local_path: "./data/static"
  base_url: "http://localhost:5679/static"

ai:
  default_text_provider: "openai"
  default_image_provider: "openai"
  default_video_provider: "doubao"
